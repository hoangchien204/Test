<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Opening UC365...</title>
</head>

<body>

<p>Đang mở ứng dụng UC365...</p>

<script>
const params = new URLSearchParams(window.location.search);
const bookId = params.get("id") || 1;

const link = `uc365://(book)/${bookId}`;

// mở app
const iframe = document.createElement("iframe");
iframe.style.display = "none";
iframe.src = link;
document.body.appendChild(iframe);

// fallback nếu app không mở
setTimeout(() => {
  document.body.innerHTML = `
    <p>Không mở được ứng dụng?</p>
    <a href="${link}">Bấm vào đây để mở</a>
  `;
}, 1500);
</script>

</body>
</html>
